org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Keep this project independent of a stale temporary JAVA_HOME value. Android
# Studio installs a compatible JDK alongside the Android SDK on this computer.
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
# AAPT2 was timing out while several resource compiler daemons processed the
# generated splash PNGs in parallel on this Windows machine. Serial resource
# work is slower but stable, and avoids the release-build failure.
org.gradle.workers.max=1
org.gradle.parallel=false
android.enableAapt2Daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
